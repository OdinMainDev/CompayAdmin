<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/landing/img/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CompayAdmin</title>

    <link rel="stylesheet" href="/landing/css/main.css" />
    <link rel="stylesheet" href="/landing/css/fontawesome-all.min.css" />
    <!-- <link rel="stylesheet" href="/landing/css/swiper-bundle.min.css" /> -->
    <!-- <link rel="stylesheet" href="/landing/css/default-icons.css" /> -->
    <!-- <link rel="stylesheet" href="/landing/css/default.css" /> -->
    <!-- <link rel="stylesheet" href="/landing/css/aos.css" /> -->
    <!-- <link rel="stylesheet" href="/landing/css/bootstrap.min.css" /> -->
    <!-- <link rel="stylesheet" href="/landing/css/animate.min.css" /> -->

    <style>
      /* overlay */
      #app-preloader {
        background-color: var(--tg-color-dark, #0b0c10);
        height: 100%;
        width: 100%;
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        transition: opacity 300ms ease;
        pointer-events: all;
      }

      /* fade-out */
      #app-preloader.is-hiding {
        opacity: 0;
        pointer-events: none;
      }

      .loader {
        width: 4px;
        color: var(--tg-primary-color, #d4a56a);
        aspect-ratio: 1;
        border-radius: 50%;
        box-shadow: 19px -19px 0 0px, 38px -19px 0 0px, 57px -19px 0 0px,
          19px 0 0 5px, 38px 0 0 5px, 57px 0 0 5px,
          19px 19px 0 0px, 38px 19px 0 0px, 57px 19px 0 0px;
        transform: translateX(-38px);
        animation: l26 2s infinite linear;
      }

      @keyframes l26 {
        12.5% {
          box-shadow: 19px -19px 0 0px, 38px -19px 0 0px, 57px -19px 0 5px,
            19px 0 0 5px, 38px 0 0 0px, 57px 0 0 5px,
            19px 19px 0 0px, 38px 19px 0 0px, 57px 19px 0 0px;
        }
        25% {
          box-shadow: 19px -19px 0 5px, 38px -19px 0 0px, 57px -19px 0 5px,
            19px 0 0 0px, 38px 0 0 0px, 57px 0 0 0px,
            19px 19px 0 0px, 38px 19px 0 5px, 57px 19px 0 0px;
        }
        50% {
          box-shadow: 19px -19px 0 5px, 38px -19px 0 5px, 57px -19px 0 0px,
            19px 0 0 0px, 38px 0 0 0px, 57px 0 0 0px,
            19px 19px 0 0px, 38px 19px 0 0px, 57px 19px 0 5px;
        }
        62.5% {
          box-shadow: 19px -19px 0 0px, 38px -19px 0 0px, 57px -19px 0 0px,
            19px 0 0 5px, 38px 0 0 0px, 57px 0 0 0px,
            19px 19px 0 0px, 38px 19px 0 5px, 57px 19px 0 5px;
        }
        75% {
          box-shadow: 19px -19px 0 0px, 38px -19px 0 5px, 57px -19px 0 0px,
            19px 0 0 0px, 38px 0 0 0px, 57px 0 0 5px,
            19px 19px 0 0px, 38px 19px 0 0px, 57px 19px 0 5px;
        }
        87.5% {
          box-shadow: 19px -19px 0 0px, 38px -19px 0 5px, 57px -19px 0 0px,
            19px 0 0 0px, 38px 0 0 5px, 57px 0 0 0px,
            19px 19px 0 5px, 38px 19px 0 0px, 57px 19px 0 0px;
        }
      }
        html, body {
          margin: 0;
          height: 100%;
          background: #0b0c10; /* твой dark */
        }
        #root { min-height: 100%; }
    </style>
  </head>

  <body>
    <div id="app-preloader" aria-label="Loading">
      <div class="loader"></div>
    </div>

    <div id="root"></div>


    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
